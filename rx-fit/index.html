<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RX Performance Diagnostic · Richards Xpress · Richards Supply</title>
<meta name="description" content="A five-minute performance diagnostic: see how a Richards Xpress (RX) managed-inventory program would fit your operation.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fit.css?v=1">
<link rel="icon" type="image/png" href="brand/rx-icon.png">
<link rel="apple-touch-icon" href="brand/rx-icon.png">
</head>
<body>


<!-- RX header navigation -->
<header class="rxbar" id="rxbar">
  <div class="rxbar-in">
    <a class="rx-mark" href="./" aria-label="Richards Xpress"><img src="brand/rx-horizontal-dark.png" alt="Richards Xpress" width="150" height="40"></a>
    <nav class="steps" id="steps" aria-label="Diagnostic steps">
      <span class="steps-ind" id="stepsInd" aria-hidden="true"></span>
    </nav>
    <div class="rpm" id="rpm" title="Performance score so far"><span>SCORE</span><b id="rpmVal">0</b></div>
  </div>
  <div class="revline"><i id="revline"></i></div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div class="actionbar" id="actionbar">
  <div class="ab-in">
    <button class="btn btn-ghost" id="back" type="button">Back</button>
    <span class="ab-step" id="abStep"></span>
    <button class="btn btn-red" id="next" type="button">Next</button>
  </div>
</div>

<footer class="site">
  <span>Richards Supply · Richards Xpress (RX) · Precision service. Maximum performance.</span>
  <span>Waco · Temple · Fort Worth</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="fit.js?v=1"></script>
</body>
</html>
